# Fast checks on every push and pull request (no image build):
# script syntax, Buildroot option resolution for all boards, cart Lua,
# web translations. Same as running scripts/check.sh locally.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends luajit shellcheck

      - name: Cache Buildroot source
        uses: actions/cache@v4
        with:
          path: buildroot
          key: buildroot-src-${{ hashFiles('Makefile') }}

      - name: Run checks
        run: scripts/check.sh

      - name: Check kernel trim
        # Static analysis of the Pi kernel's Kconfig (the commit Buildroot builds):
        # no option PICO8-OS needs may depend on anything linux-trim.fragment disables.
        run: |
          set -eu
          commit=$(sed -n 's/.*github,raspberrypi,linux,\([0-9a-f]*\)).*/\1/p' buildroot/configs/raspberrypi3_defconfig)
          mkdir -p /tmp/linux
          curl -fsSL "https://codeload.github.com/raspberrypi/linux/tar.gz/$commit" \
            | tar -xz -C /tmp/linux --wildcards '*Kconfig*' '*/arch/arm/configs/bcm*' '*/arch/arm64/configs/bcm*'
          python3 scripts/check-kernel-trim.py "/tmp/linux/linux-$commit"
