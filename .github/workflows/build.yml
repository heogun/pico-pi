# Full image builds. Runs on version tags (v*) and by hand (Actions tab →
# build → Run workflow). Each board builds in its own job; a tag also
# publishes a GitHub Release with the SD card images and the OTA files
# (pico8os-<board>-<version>.pico8os-update + latest-<board>.txt), so
#   OTA_URL=https://github.com/<owner>/<repo>/releases/latest/download
# works as the update server (public repositories only: consoles cannot
# log in to download from a private one).
#
# OTA signing: set the repository secret OTA_PRIVATE_KEY to the contents of
# keys/ota-private.pem (`gh secret set OTA_PRIVATE_KEY < keys/ota-private.pem`);
# it must match keys/ota-public.pem in git. The key is only given to the
# "sign" job, never to the build jobs. Without it, manual builds produce
# unsigned OTA bundles; tag builds refuse to publish.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      boards:
        description: 'Boards to build (space separated)'
        default: 'rpi0 rpi2 rpi3 rpi4 rpi5 qemu'
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      boards: ${{ steps.plan.outputs.boards }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          BOARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.boards || 'rpi0 rpi2 rpi3 rpi4 rpi5 qemu' }}
        run: |
          set -eu
          json='['
          for b in $BOARDS; do
            case $b in
              rpi0|rpi2|rpi3|rpi4|rpi5|qemu) json="$json\"$b\"," ;;
              *) echo "::error::unknown board '$b' (use rpi0 rpi2 rpi3 rpi4 rpi5 qemu)"; exit 1 ;;
            esac
          done
          [ "$json" != '[' ] || { echo "::error::no boards given"; exit 1; }
          echo "boards=${json%,}]" >> "$GITHUB_OUTPUT"
          # one version for every board of this run (sortable, newer = greater)
          echo "version=$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
      PICO8OS_VERSION: ${{ needs.setup.outputs.version }}
      BR2_DL_DIR: /mnt/pico8os/dl
      OUT_ROOT: /mnt/pico8os/output
      CCACHE_DIR: /mnt/pico8os/ccache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare disk
        # Buildroot needs ~15 GB per board: build on the runner's /mnt disk.
        run: |
          sudo mkdir -p /mnt/pico8os
          sudo chown "$(id -u):$(id -g)" /mnt/pico8os
          mkdir -p "$BR2_DL_DIR" "$OUT_ROOT" "$CCACHE_DIR"
          df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libncurses-dev libssl-dev rsync cpio \
            unzip file wget python3 perl patch xz-utils openssl

      - name: Cache Buildroot source
        uses: actions/cache@v4
        with:
          path: buildroot
          key: buildroot-src-${{ hashFiles('Makefile') }}

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: /mnt/pico8os/dl
          key: dl-${{ matrix.board }}-${{ hashFiles('Makefile', 'external/**/*.config', 'external/**/*.mk', 'external/**/*.hash') }}
          restore-keys: |
            dl-${{ matrix.board }}-
            dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /mnt/pico8os/ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.board }}-

      # No signing key here: the build runs third-party code (Buildroot and
      # every package it downloads). Images carry keys/ota-public.pem from
      # git; the OTA bundles stay unsigned until the "sign" job.
      - name: Check the OTA public key
        run: test -s keys/ota-public.pem && test ! -e keys/ota-private.pem

      - name: Build ${{ matrix.board }}
        run: |
          printf 'BR2_CCACHE=y\nBR2_CCACHE_DIR="%s"\n' "$CCACHE_DIR" > ci.config
          make "$BOARD" OUT_ROOT="$OUT_ROOT" EXTRA_CONFIG="$PWD/ci.config"

      - name: Package
        run: |
          set -eu
          mkdir -p upload
          xz -T0 -6 -c "dist/pico8os-$BOARD.img" > "upload/pico8os-$BOARD-$PICO8OS_VERSION.img.xz"
          upd="pico8os-$BOARD-$PICO8OS_VERSION.pico8os-update"
          cp "dist/$upd" upload/
          printf 'version=%s\nurl=%s\n' "$PICO8OS_VERSION" "$upd" > "upload/latest-$BOARD.txt"
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.board }}-${{ needs.setup.outputs.version }}
          path: upload/*
          compression-level: 0
          retention-days: 3

  # Signs the OTA bundles. Only this job sees OTA_PRIVATE_KEY, and it runs
  # nothing from the build except reading its output files.
  sign:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sign-update.sh
            keys/ota-public.pem
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: upload
          merge-multiple: true

      - name: Sign
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -eu
          if [ -n "$OTA_PRIVATE_KEY" ]; then
            key=$(mktemp); trap 'rm -f "$key"' EXIT
            printf '%s\n' "$OTA_PRIVATE_KEY" > "$key"
            # must match the public key the images were built with
            openssl ec -in "$key" -pubout 2>/dev/null | cmp -s - keys/ota-public.pem \
              || { echo "::error::OTA_PRIVATE_KEY does not match keys/ota-public.pem"; exit 1; }
            for f in upload/*.pico8os-update; do scripts/sign-update.sh "$f" "$key"; done
          elif [ "$IS_TAG" = true ]; then
            echo "::error::Release builds need the OTA_PRIVATE_KEY secret (see the comment at the top of build.yml)"
            exit 1
          else
            echo "::warning::No OTA_PRIVATE_KEY secret: the OTA bundles are unsigned and no console will install them."
          fi
          for b in upload/latest-*.txt; do
            b=${b#upload/latest-}; b=${b%.txt}
            (cd upload && sha256sum pico8os-"$b"-* "latest-$b.txt" > "SHA256SUMS-$b")
          done
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: pico8os-${{ needs.setup.outputs.version }}
          path: upload/*
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [setup, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pico8os-${{ needs.setup.outputs.version }}
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -eu
          cat release/SHA256SUMS-* > release/SHA256SUMS && rm release/SHA256SUMS-*
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "PICO8-OS $TAG ($VERSION)" \
            --notes "SD card images (pico8os-<board>-$VERSION.img.xz) and OTA updates (.pico8os-update) for each board. PICO-8 itself is not included."
