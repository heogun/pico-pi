# PICO8-OS: a console that pairs game controllers and nothing else.
[General]
Name = PICO8-OS
DiscoverableTimeout = 0
# Pairing is only open while pico8-btpair runs (it turns it off again);
# this is a safety net if it is killed.
AlwaysPairable = false
PairableTimeout = 180
FastConnectable = true
# Controllers that lost their pairing (re-paired elsewhere) can re-pair.
JustWorksRepairing = always

[Policy]
# Power the radio on at boot so paired controllers reconnect by themselves.
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
